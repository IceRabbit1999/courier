[workspace]
members = [
    "crates/app",
    "crates/shared",
    "crates/i18n",
    "crates/configs",
    "crates/ui",
    "crates/plugins/plugin-core",
]

resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/IceRabbit1999/courier"
authors = ["IceRabbit"]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

# UI
eframe = { version = "0.34.3", default-features = true }
egui = { version = "0.34.3" }
egui-phosphor = "0.12"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

# Configuration
config = "0.15"
directories = "6"

# i18n
fluent = "0.17"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"

# Error handling
snafu = { version = "0.9", features = ["unstable-provider-api"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
parking_lot = "0.12"
rfd = "0.17"
sysinfo = "0.35"

# Workspace crates
shared = { path = "crates/shared" }
i18n = { path = "crates/i18n" }
configs = { path = "crates/configs" }
ui = { path = "crates/ui" }
plugin-core = { path = "crates/plugins/plugin-core" }

# Async runtime bridge
tokio-util = { version = "0.7" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"
